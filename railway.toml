# Railway config — https://docs.railway.com/reference/config-as-code
#
# Deploys the bot as a Node web service. Railway auto-detects the repo
# language from package.json; this file just pins the start command and
# healthcheck.
#
# Variables (DISCORD_BOT_TOKEN, GOOGLE_CLIENT_SECRET, TUNNEL_TOKEN, etc.) are
# NOT declared here. Add them in the Railway dashboard → your service →
# Variables tab. See .env.example for the full list.
#
# The Google service-account JSON goes in a single Variable named
# GOOGLE_SERVICE_ACCOUNT_KEY as a multi-line string. See README section
# 1d for the exact steps.

[build]
builder = "NIXPACKS"          # Railway's default. Detects Node, runs npm install.

[deploy]
# Runs the Cloudflare Tunnel daemon alongside the Node bot via start.sh.
# start.sh uses set -e + wait -n so a failure in either process fails the
# container, triggering Railway's restart policy.
#
# TUNNEL_TOKEN, PORT, and the rest of the bot's env vars come from the
# Variables tab — not declared here.
#
# config.yml (next to start.sh in the repo) routes
# discord-bot.thecomingofstages.com to http://localhost:8080, which is
# where authServer.js binds (Railway sets $PORT to 8080 by default).
startCommand = "./start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Nixpacks: install cloudflared so start.sh can find /usr/bin/cloudflared.
# Without this, the startCommand fails and only the Node half boots,
# which is exactly the failure mode that produced the original 1033 error.
[build.apt]
packages = ["cloudflared"]